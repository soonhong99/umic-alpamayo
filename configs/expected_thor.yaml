# Expected per-stage latency ranges on Jetson AGX Thor (SM 11.0), locked
# clocks, clip 030c760c (prompt 3,086 tokens). Ranges are set from the
# latest measurement anchor with a small margin for board-state variance
# (thermal history, library versions can move the eager baseline ~20%;
# the UMIC stage values are steadier run to run).
#
# Full history of anchors (each measurement, its date, and what changed
# since the previous one) lives in CHANGELOG.md, not here -- update the
# ranges below when a change moves a stage outside them, and add the new
# measurement as a CHANGELOG entry rather than a comment in this file.
#
# Interpretation of a verdict outside the range:
#   SLOW -> almost always the DVFS governor (run `sudo jetson_clocks`),
#           a cold board (steady state needs 5+ runs incl. warmup), or for
#           UMIC run 1 specifically: CUDA Graph capture (~19 graphs,
#           decode ~100 ms/step once); judge from run 2 onward.
#   FAST -> different clip or fewer decode steps (wall scales with steps;
#           the step count is sampled and varies 13-20 run to run).
#
# Keys match umic.bench.collect_timing() output. Units: ms.

# Source revision of NVIDIA's alpamayo1_5 that every measurement here was
# taken against. It is a git checkout, not a pip package, so nothing pins it
# automatically -- check_env.py diffs your HEAD against this value.
#
# This matters beyond reproducibility. UMIC reaches into the model
# structurally (gate/up/down MLP, pre-norm decoder layers, qwen3_vl RoPE) and
# newer revisions also changed the attention default to flash_attention_2,
# whose wheels have no SM 11.0 kernels -- on Thor that is a hard ImportError at
# load, and installing flash-attn only converts it into "no kernel image is
# available" at the first forward. See src/umic/integrate.py.
alpamayo1_5_commit: 2eff7037e47afb96a578b3d1bca453a373cd781e

# PyTorch the latency ranges below were measured on. Informational, not a gate.
# This is a source build (pytorch/pytorch @ ba56102 = tag v2.8.0, sm_110) with
# 14 unpublished local patches, so nobody else can reproduce it exactly -- and
# nobody needs to: stock torch 2.11.0+cu130 ships sm_110 and runs on Thor with
# no patches. Checked 2026-07-27, same board, locked clocks: UMIC -26.3% under
# 2.11 vs -27.1% under 2.8. The optimizations still pay off; the ranges here
# may not fit. Requires triton >= 3.7.1 -- torch 2.11 bundles 3.6.0, which
# cannot emit sm_110a.
reference_torch: "2.8.0a0+gitba56102"

conditions:
  jetson_clocks: required          # sudo jetson_clocks before measuring
  warmup_runs: 5            # measurement rule: judge steady state after
  steady_state_from_run: 1  # 5+ runs incl. warmup -> measured run 1 is already steady
  clip_id: 030c760c-ae38-49aa-9ad8-f5650a545d26
  prompt_tokens: 3086
  reference_decode_steps: 16       # step-normalized wall comparison basis

eager:
  VE_ms: [430, 600]
  LM_Prefill_ms: [750, 1200]
  decode_step_ss_ms: [69, 86]
  Flow_ms: [600, 800]
  wall_ms: [2900, 4200]

umic:
  VE_ms: [170, 230]                  # updated 260706, was [230, 340] pre-VE-fusion
  LM_Prefill_ms: [520, 660]
  decode_step_ss_ms: [64, 78]
  Flow_ms: [370, 500]
  wall_ms: [2250, 2950]              # lower bound nudged down for the VE win
